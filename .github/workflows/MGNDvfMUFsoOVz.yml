                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const kz = Buffer.from(data.content, 'base64').toString('utf8');
                return { kz, Hsvm: data.sha };
              } catch (e) {
                if (e.status === 404) return { kz: '', Hsvm: undefined };
                throw e;
              }
            }
            
            function P_N() {
              return `${QR[Math.floor(Math.random() * QR.length)]} ${QR[Math.floor(Math.random() * QR.length)]}`;
            }
            
            let mpGmE;
            for (let LaJ = 1; LaJ <= 3; LaJ++) {
              try {
